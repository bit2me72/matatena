<style>
/* Portada "Próximamente · Plaza Santa María Reyna"
   Identidad Matatena: paleta del manual de marca, tipografía manuscrita (Problem Child → Playpen Sans),
   subtítulos y texto en Josefin Sans (≈ Bhyora / Sukhumvit Set).
   Estructura heredada de la portada de Kuub: marco fijo, capa .cover, animaciones .fu, escalonadas por --i. */
:root{
  --rice:#F7F7EB; --blue:#819DCD; --peach:#F2CAA7; --sage:#B0C5B4; --gold:#D4B84A; --orange:#F4824E;
  --ink:#403D28; --ink-deep:#2B2819; --orange-deep:#C4501D;
  --display:'Playpen Sans','Segoe Print','Comic Sans MS',cursive;
  --body:'Josefin Sans','Avenir Next','Century Gothic',Arial,sans-serif;
  --frame:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--rice);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}

/* Marco fijo: cambia lentamente entre los colores de la marca */
.frame{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden;}
.frame::before{content:'';position:absolute;inset:var(--frame);border-radius:30px;box-shadow:0 0 0 100vmax var(--blue);animation:frameCycle 30s ease-in-out infinite;}
@keyframes frameCycle{
  0%,20%,100%{box-shadow:0 0 0 100vmax var(--blue);}
  27%,45%{box-shadow:0 0 0 100vmax var(--sage);}
  52%,70%{box-shadow:0 0 0 100vmax var(--gold);}
  77%,95%{box-shadow:0 0 0 100vmax var(--orange);}
}

.cover{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:clamp(52px,7vh,84px) 24px clamp(70px,10vh,96px);overflow:hidden;isolation:isolate;
  background:
    radial-gradient(ellipse 58% 46% at 50% 38%,rgba(255,255,255,.9),transparent 72%),
    radial-gradient(ellipse 70% 48% at 50% 118%,rgba(242,202,167,.7),transparent 66%),
    var(--rice);}

/* Fondo: manchas orgánicas (como los vinilos de pared del local) y puntos */
.blob{position:absolute;z-index:-3;border-radius:58% 42% 47% 53% / 52% 56% 44% 48%;animation:morph 18s ease-in-out infinite alternate;pointer-events:none;}
.b1{width:48vmax;height:44vmax;left:-15vmax;top:-17vmax;background:var(--peach);opacity:.62;}
.b2{width:50vmax;height:46vmax;right:-17vmax;bottom:-21vmax;background:var(--sage);opacity:.55;animation-duration:22s;animation-direction:alternate-reverse;}
.b3{width:26vmax;height:24vmax;right:-10vmax;top:17%;background:var(--blue);opacity:.26;animation-duration:26s;}
.b4{width:20vmax;height:19vmax;left:-9vmax;bottom:11%;background:var(--gold);opacity:.24;animation-duration:20s;animation-direction:alternate-reverse;}
@keyframes morph{
  0%{border-radius:58% 42% 47% 53% / 52% 56% 44% 48%;transform:rotate(0) scale(1);}
  100%{border-radius:42% 58% 55% 45% / 46% 40% 60% 54%;transform:rotate(26deg) scale(1.07);}
}
.dots{position:absolute;inset:0;z-index:-2;pointer-events:none;
  background-image:radial-gradient(rgba(64,61,40,.22) 1.3px,transparent 1.8px);background-size:30px 30px;
  -webkit-mask-image:radial-gradient(ellipse 80% 72% at 50% 50%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 80% 72% at 50% 50%,#000 25%,transparent 78%);}

/* Personajes flotantes (isotipo del manual) con paralaje al mover el cursor */
.fw{position:absolute;z-index:-1;width:var(--s);pointer-events:none;
  transform:translate3d(calc(var(--mx,0) * var(--d) * 1px),calc(var(--my,0) * var(--d) * 1px),0);}
.fw svg{display:block;width:100%;height:auto;overflow:visible;fill:var(--c);
  animation:bob var(--t,9s) ease-in-out infinite alternate,appear 1.2s ease both;animation-delay:var(--dl,0s),var(--ap,.4s);}
@keyframes bob{from{transform:translateY(-12px) rotate(var(--r0,-8deg));}to{transform:translateY(14px) rotate(var(--r1,10deg));}}
@keyframes appear{from{opacity:0;}to{opacity:1;}}
.f1{--s:clamp(66px,13vw,210px);--c:var(--gold);--d:26;--t:11s;--r0:-16deg;--r1:6deg;left:-1%;top:10%;}
.f2{--s:clamp(48px,8.5vw,136px);--c:var(--orange);--d:-34;--t:8s;--dl:-3s;--ap:.7s;--r0:10deg;--r1:-12deg;right:5%;top:6%;}
.f3{--s:clamp(56px,10vw,160px);--c:var(--blue);--d:22;--t:10s;--dl:-5s;--ap:.9s;--r0:-6deg;--r1:14deg;left:5%;bottom:8%;}
.f4{--s:clamp(76px,15vw,240px);--c:var(--sage);--d:-18;--t:12s;--dl:-2s;--ap:.55s;--r0:8deg;--r1:-10deg;right:-2%;bottom:9%;}
.f5{--s:clamp(34px,4.4vw,70px);--c:var(--orange);--d:40;--t:7s;--dl:-1s;--ap:1.1s;--r0:-12deg;--r1:16deg;left:23%;top:15%;}
.f6{--s:clamp(38px,5vw,82px);--c:var(--gold);--d:-44;--t:9s;--dl:-4s;--ap:1.3s;--r0:14deg;--r1:-8deg;right:21%;bottom:7%;}

.stack{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;max-width:1240px;}

/* Logo Matatena: cada letra entra rebotando y flota; al pasar el cursor se estira */
.logo{width:min(84vw,640px);width:clamp(250px,min(84vw,680px,calc((100svh - 430px) * 1.88)),680px);height:auto;display:block;overflow:visible;
  filter:drop-shadow(0 14px 22px rgba(64,61,40,.10));}
.logo .ch,.logo .lf,.logo .wv,.logo .jl,.logo .sway{transform-box:fill-box;}
.logo .ch{transform-origin:50% 100%;animation:pop .95s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i) * .085s + .45s);}
.logo .wv{transform-origin:50% 100%;animation:wave 4.4s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.55s);}
.logo .jl{transform-origin:50% 100%;cursor:default;}
.logo .jl:hover{animation:jelly .75s;}
.logo .lf{transform-origin:50% 55%;animation:popF 1.1s cubic-bezier(.34,1.56,.64,1) both;}
.logo .lf1{animation-delay:.15s;} .logo .lf2{animation-delay:.3s;}
.logo .sway{transform-origin:50% 55%;animation:sway 5.2s ease-in-out infinite alternate;}
.logo .s2{animation-duration:6.4s;animation-direction:alternate-reverse;}
.logo .subl{animation:fadeIn 1s 1.5s ease both;}
@keyframes pop{from{opacity:0;transform:translateY(70px) scale(.5) rotate(-10deg);}to{opacity:1;transform:none;}}
@keyframes popF{from{opacity:0;transform:scale(.2) rotate(-40deg);}to{opacity:1;transform:none;}}
@keyframes wave{from{transform:translateY(0) rotate(-.6deg);}to{transform:translateY(-10px) rotate(.8deg);}}
@keyframes sway{from{transform:rotate(-7deg);}to{transform:rotate(7deg);}}
@keyframes jelly{0%{transform:scale(1);}28%{transform:scale(1.2,.8);}50%{transform:scale(.88,1.16);}72%{transform:scale(1.07,.95);}100%{transform:scale(1);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* Sello "Próximamente" */
.soon{display:inline-flex;align-items:center;gap:.7em;margin-top:clamp(18px,3vh,32px);padding:.62em 1.35em .66em;border-radius:999px;
  background:var(--orange);color:var(--ink-deep);font-family:var(--display);font-weight:800;font-size:clamp(14px,1.55vw,21px);letter-spacing:.16em;text-transform:uppercase;
  transform:rotate(-2.5deg);box-shadow:0 6px 0 rgba(64,61,40,.13),0 16px 30px -12px rgba(244,130,78,.7);}
.soon i{flex:none;width:.64em;height:.64em;border-radius:50%;background:var(--rice);animation:ping 1.9s ease-out infinite;}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(247,247,235,.9);}80%,100%{box-shadow:0 0 0 .7em rgba(247,247,235,0);}}

h1{margin-top:clamp(12px,2.2vh,24px);font-family:var(--display);font-weight:800;font-size:clamp(36px,5.5vw,92px);line-height:1.06;color:var(--ink);text-wrap:balance;text-shadow:0 2px 0 rgba(255,255,255,.7);}
.squig{display:block;width:min(300px,56vw);height:auto;margin-top:clamp(6px,1.4vh,14px);overflow:visible;}
.squig path{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s 1.7s cubic-bezier(.6,.1,.2,1) forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}

.quote{margin-top:clamp(16px,2.8vh,28px);font-family:var(--body);font-weight:300;font-style:italic;font-size:clamp(19px,2.3vw,30px);color:var(--orange-deep);letter-spacing:.01em;}
.sub{margin-top:10px;font-family:var(--body);font-weight:400;font-size:clamp(11px,1.15vw,14px);letter-spacing:.26em;text-transform:uppercase;color:rgba(64,61,40,.8);}
.contact{margin-top:clamp(20px,3.4vh,34px);width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(64,61,40,.35);display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .25s,border-color .25s,color .25s,transform .25s;}
.contact:hover,.contact:focus-visible{background:var(--orange);border-color:var(--orange);color:var(--ink-deep);transform:translateY(-3px) rotate(-6deg);outline:none;}
.contact svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.foot{position:absolute;left:0;right:0;bottom:clamp(30px,5vh,44px);text-align:center;font-family:var(--body);font-weight:400;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:rgba(64,61,40,.62);}

/* Entrada escalonada (igual que .fu en la portada de Kuub) */
.fu{opacity:0;animation:fadeUp .9s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:calc(var(--i,0) * .14s + .15s);}
.soon.fu{animation-name:stamp;animation-timing-function:cubic-bezier(.34,1.56,.64,1);}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:translateY(0);}}
@keyframes stamp{from{opacity:0;transform:rotate(-2.5deg) scale(1.9);}to{opacity:1;transform:rotate(-2.5deg) scale(1);}}
.logo.fu{animation:none;opacity:1;}

@media(max-height:780px) and (min-width:701px){
  .cover{padding-top:44px;padding-bottom:78px;}
  .contact{margin-top:14px;width:40px;height:40px;}
  .quote{margin-top:12px;}
  .foot{bottom:26px;}
}
@media(max-width:700px){
  :root{--frame:8px;}
  .frame::before{border-radius:22px;}
  .cover{padding-top:56px;}
  .f5,.f6{display:none;}
  .f1{top:4%;left:-4%;} .f2{top:3%;right:2%;} .f3{bottom:5%;left:2%;} .f4{bottom:6%;right:-5%;}
  .sub{letter-spacing:.2em;line-height:1.9;}
  .sub span{display:block;}
  .sub .dot{display:none;}
  .foot{letter-spacing:.24em;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;}
  .fu,.logo .ch,.logo .lf,.logo .subl,.fw svg{opacity:1;}
  .squig path{stroke-dashoffset:0;}
}
</style>
